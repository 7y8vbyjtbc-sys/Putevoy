name: Build Windows exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name PutevyeListy --collect-all tkinterdnd2 --add-data "shops.json;." putevoy_gui.py
      - run: copy shops.json dist\shops.json
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: PutevyeListy
          path: dist/
